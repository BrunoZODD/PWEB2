<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        function raiz(num) {
            var resultado = Math.sqrt(num);
            alert('A raiz quadrada de ' + num + ' é: ' + resultado);

        }
        function escreverNaDiv(texto) {
            document.getElementById('minhaDiv').innerHTML = texto;
        }
        function escreverTexto() {
            var texto = prompt('Digite o texto que deseja escrever:');
            document.getElementById('minhaDiv2').innerHTML = texto;
        }
        function desafio(n) {
            var n = parseInt(prompt('Digite o valor de n:'));
            if (isNaN(n) || n <= 0) {
                alert('Por favor, digite um número válido maior que zero.');
                return;
                document.getElementById('desafio').innerHTML = 'o resultado e: ' + n;
            }

        }
        function escrevern() {
            var input = document.getElementById('numeroinput');
            var n = parseInt(input.value);
            if (isNaN(n) || n <= 0) {
                alert('Por favor, digite um número válido maior que zero.');
                return;
            }
            var div = document.getElementById('numerosinput');
            div.innerHTML = "";
            for (var i = 1; i <= n; i++) {
                div.innerHTML += i + "<br>";
            }
        }

    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade2</title>
</head>
<body>
    <h1><b>Raiz quadrada</b></h1>
<button onclick="raiz(25)">raiz 25</button><br><br>
<button onclick="raiz(36)">raiz 36</button><br><br>
<button onclick="raiz(49)">raiz 49</button><br><br>
<hr>
    <h2>Ecrevendo na div</h2>
<button onclick="escreverNaDiv('<h1>programação web</h1>')">Escrever</button> <br><br>
<div id="minhaDiv"></div>
<hr>

    <h2>escrevendo texto dinamico</h2>
    <button onclick="escreverTexto()">Escrever</button> <br><br>
    <div id="minhaDiv2"></div>
<hr>
    <h2>Desafio</h2>
<button onclick="desafio(n)">Desafio</button> <br><br>
    <div id="desafio"></div>
<hr>
    <h2>Desfio com input</h2>
<label for="numeroinput">Digite o valor de n:</label>
<input type="number" id="numeroinput" placeholder="digite um numero" min="1" required>
<button onclick="escrevern()">escrever</button> <br><br>
<div id="numerosinput"></div>



</body>
</html>
