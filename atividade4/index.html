<!DOCTYPE html>
<html lang="en">
<head>
    <script>

        let linguagens = Array();

        linguagens[0] = "dart";
        linguagens[1] = "PHP";
        linguagens[2] = "java";
        linguagens[3] = "python";
        linguagens[4] = "perl";
        linguagens[5] = "Ruby on Rails";
        linguagens[6] = "C ++";

        function mostrarlistalinguagens() {
            const container = document.getElementById('minhadiv');   
            for (let i = 0; i < linguagens.length; i++) {
                var tag = '<h5>' + i + ' - ' + linguagens[i] + '</h5>'; 
                container.innerHTML += tag;
            }
        }
        function posicaolinguagens() {
            var indice = prompt('Digite o indice da linguagem que deseja consultar:');
            alert('A linguagem que será consultada é: ' + linguagens[indice]);
            }

             let frutas = Array();

        frutas[0] = "maca";
        frutas[1] = "banana";
        frutas[2] = "uva";
        frutas[3] = "pera";
        frutas[4] = "laranja";
        frutas[5] = "abacaxi";
        frutas[6] = "manga";

        function mostrarlistafutas() {
            const container = document.getElementById('minhadiv');   
            for (let i = 0; i < frutas.length; i++) {
                var tag = '<h5>' + i + ' - ' + frutas[i] + '</h5>'; 
                container.innerHTML += tag;
            }
        }
        function posicaofrutas() {
            var indice = prompt('Digite o indice da fruta que deseja consultar:');
            alert('A fruta que será consultada é: ' + frutas[indice]);
            }    
           
    

















        
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Arrays de linguagens</h1>

    <button onclick="mostrarlistalinguagens()">Criar Array</button> <br><br>
    <button onclick="posicaolinguagens()">posicao no Array</button>
    <div id="minhadiv"></div>

    <h2>Array de frutas</h2>

    <button onclick="mostrarlistafutas()">Criar Array</button> <br><br>
    <button onclick="posicaofrutas()">posicao no Array</button>
    <div id="minhadiv"></div>








</body>
</html>
