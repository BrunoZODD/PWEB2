<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Cursos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2 class="text-center mb-4">Cadastro de Cursos</h2>

    <div class="card p-4 mb-3">

        <div class="row">

            <div class="col-md-5">
                <label class="form-label">Nome do Curso</label>
                <input type="text"
                       id="nomeCurso"
                       class="form-control"
                       placeholder="Ex: informatica, enfermagem, etc...">
            </div>

            <div class="col-md-3">
                <label class="form-label">Regime</label>

                <select id="regime" class="form-select">
                    <option value="" selected disabled hidden>Selecione...</option>
                    <option value="Superior">Superior</option>
                    <option value="Medio">Medio</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Carga Horária (h)</label>

                <input type="number"
                       id="cargaHoraria"
                       class="form-control"
                       placeholder="Ex: 1200">
            </div>

        </div>

        <div class="mt-3">
            <button class="btn btn-primary" id="btnSalvar" onclick="adicionarOuSalvarCurso()">
                Salvar
            </button>
        </div>

    </div>

    <div class="mb-2">

        <button class="btn btn-danger" onclick="removerUltimo()">
            Remover último
        </button>
        <button class="btn btn-danger" onclick="limparLista()">
            Limpar
        </button>
        <button class="btn btn-secondary" onclick="inverterLista()">
            Inverter
        </button>

    </div>


    <table class="table table-striped table-bordered">

        <thead class="table-dark">

            <tr>
                <th>#</th>
                <th>Nome</th>
                <th>Regime</th>
                <th>Carga Horária</th>
                <th>Ações</th>
            </tr>

        </thead>

        <tbody id="tabelaCursos"></tbody>

    </table>

</div>


<script>

    let cursos = [];
    let indiceEdicao = null;


    function mostrarCursos() {

        const tabela = document.getElementById("tabelaCursos");

        tabela.innerHTML = "";

        cursos.forEach((curso, index) => {

            tabela.innerHTML += `
                <tr>

                    <td>${index + 1}</td>

                    <td>${curso.nome}</td>

                    <td>${curso.regime}</td>

                    <td>${curso.carga} h</td>

                    <td>

                        <button
                            class="btn btn-secondary btn-sm"
                            onclick="carregarParaEdicao(${index})">
                            Alterar
                        </button>

                        <button
                            class="btn btn-danger btn-sm"
                            onclick="removerCurso(${index})">
                            Remover
                        </button>

                    </td>

                </tr>
            `;

        });

    }


    function adicionarOuSalvarCurso() {

        const nome = document.getElementById("nomeCurso").value;
        const regime = document.getElementById("regime").value;
        const carga = document.getElementById("cargaHoraria").value;

        if (nome === "" || regime === "" || carga === "") {

            alert("Preencha todos os campos!");

            return;
        }

        if (indiceEdicao === null) {
            cursos.push({
                nome: nome,
                regime: regime,
                carga: carga
            });
        } else {
            cursos[indiceEdicao] = {
                nome: nome,
                regime: regime,
                carga: carga
            };
            indiceEdicao = null;
        }

        limparFormulario();
        mostrarCursos();

    }


    function carregarParaEdicao(index) {

        document.getElementById("nomeCurso").value = cursos[index].nome;
        document.getElementById("regime").value = cursos[index].regime;
        document.getElementById("cargaHoraria").value = cursos[index].carga;

        indiceEdicao = index;

    }


    function limparFormulario() {

        document.getElementById("nomeCurso").value = "";
        document.getElementById("regime").value = "";
        document.getElementById("cargaHoraria").value = "";

    }


    function removerCurso(index) {

        cursos.splice(index, 1);

        mostrarCursos();

    }

    function removerUltimo() {

        if (cursos.length > 0) {

            cursos.pop();

            mostrarCursos();

        }

    }

    function limparLista() {

        cursos = [];

        mostrarCursos();

    }

    function inverterLista() {

        cursos.reverse();

        mostrarCursos();

    }

    mostrarCursos();

</script>

</body>
</html>
